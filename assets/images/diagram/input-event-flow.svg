<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">LVGL input and event flow</title>
  <desc id="desc">CST816T touch data passes through a driver and LVGL pointer input to widget events and application callbacks.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#57606a"/>
    </marker>
  </defs>
  <style>
    .box { fill:#f6f8fa; stroke:#57606a; stroke-width:2; rx:9; }
    .accent { fill:#eaf2ff; stroke:#316dca; stroke-width:2; rx:9; }
    .head { font:600 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#24292f; }
    .text { font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#424a53; }
    .line { stroke:#57606a; stroke-width:2; marker-end:url(#arrow); }
  </style>
  <text class="head" x="500" y="34" text-anchor="middle">Hardware Input → LVGL Event → Application Callback</text>
  <rect class="accent" x="25" y="78" width="150" height="88"/>
  <text class="head" x="100" y="112" text-anchor="middle">CST816T</text>
  <text class="text" x="100" y="136" text-anchor="middle">I²C0 · PB4 EXTI</text>
  <line class="line" x1="175" y1="122" x2="210" y2="122"/>
  <rect class="box" x="220" y="78" width="150" height="88"/>
  <text class="head" x="295" y="112" text-anchor="middle">Touch Driver</text>
  <text class="text" x="295" y="136" text-anchor="middle">state · X / Y</text>
  <line class="line" x1="370" y1="122" x2="405" y2="122"/>
  <rect class="box" x="415" y="78" width="150" height="88"/>
  <text class="head" x="490" y="108" text-anchor="middle">LVGL indev</text>
  <text class="text" x="490" y="132" text-anchor="middle">pointer read_cb</text>
  <text class="text" x="490" y="151" text-anchor="middle">pressed / released</text>
  <line class="line" x1="565" y1="122" x2="600" y2="122"/>
  <rect class="box" x="610" y="78" width="150" height="88"/>
  <text class="head" x="685" y="108" text-anchor="middle">Widget Event</text>
  <text class="text" x="685" y="132" text-anchor="middle">Gesture · Clicked</text>
  <text class="text" x="685" y="151" text-anchor="middle">Value Changed</text>
  <line class="line" x1="760" y1="122" x2="795" y2="122"/>
  <rect class="accent" x="805" y="78" width="170" height="88"/>
  <text class="head" x="890" y="108" text-anchor="middle">Callback</text>
  <text class="text" x="890" y="132" text-anchor="middle">Screen / UI state</text>
  <text class="text" x="890" y="151" text-anchor="middle">hardware callback</text>
  <text class="text" x="500" y="225" text-anchor="middle">PC simulator replaces CST816T with SDL mouse, keyboard and mouse-wheel encoder drivers.</text>
</svg>
