<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-labelledby="title desc">
  <title id="title">LVGL display pipeline</title>
  <desc id="desc">LVGL renderer sends partial draw buffer data through a synchronous flush callback and SPI0 to an ST7789 LCD.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#57606a"/>
    </marker>
  </defs>
  <style>
    .box { fill:#f6f8fa; stroke:#57606a; stroke-width:2; rx:9; }
    .accent { fill:#eaf2ff; stroke:#316dca; stroke-width:2; rx:9; }
    .head { font:600 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#24292f; }
    .text { font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#424a53; }
    .line { stroke:#57606a; stroke-width:2; marker-end:url(#arrow); }
  </style>
  <rect width="1000" height="270" fill="#ffffff"/>
  <text class="head" x="500" y="32" text-anchor="middle">Polling / Synchronous Flush · 240×280 · RGB565</text>
  <rect class="accent" x="25" y="75" width="145" height="85"/>
  <text class="head" x="97" y="110" text-anchor="middle">LVGL Renderer</text>
  <text class="text" x="97" y="135" text-anchor="middle">Invalidated area</text>
  <line class="line" x1="170" y1="118" x2="205" y2="118"/>
  <rect class="box" x="215" y="75" width="145" height="85"/>
  <text class="head" x="287" y="106" text-anchor="middle">Draw Buffer</text>
  <text class="text" x="287" y="130" text-anchor="middle">2 × 240 × 10</text>
  <text class="text" x="287" y="149" text-anchor="middle">partial buffers</text>
  <line class="line" x1="360" y1="118" x2="395" y2="118"/>
  <rect class="box" x="405" y="75" width="145" height="85"/>
  <text class="head" x="477" y="106" text-anchor="middle">Flush Callback</text>
  <text class="text" x="477" y="130" text-anchor="middle">ST7789_Fill()</text>
  <text class="text" x="477" y="149" text-anchor="middle">lv_disp_flush_ready()</text>
  <line class="line" x1="550" y1="118" x2="585" y2="118"/>
  <rect class="box" x="595" y="75" width="145" height="85"/>
  <text class="head" x="667" y="110" text-anchor="middle">SPI0</text>
  <text class="text" x="667" y="135" text-anchor="middle">physical transfer</text>
  <line class="line" x1="740" y1="118" x2="775" y2="118"/>
  <rect class="accent" x="785" y="75" width="190" height="85"/>
  <text class="head" x="880" y="106" text-anchor="middle">ST7789 / LCD</text>
  <text class="text" x="880" y="130" text-anchor="middle">240 × 280</text>
  <text class="text" x="880" y="149" text-anchor="middle">16-bit byte swap</text>
  <text class="text" x="500" y="215" text-anchor="middle">SPI0 uses polling; the flush path completes synchronously before LVGL is notified.</text>
  <text class="text" x="500" y="240" text-anchor="middle">No GD32 DMA, DMA2D, LTDC or GPU acceleration path is present in the mainline project.</text>
</svg>
