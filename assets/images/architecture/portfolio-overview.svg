<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">LVGL GUI runtime pipeline</title><desc id="desc">Application UI descends through LVGL objects, events, layout, rendering, display and input ports, board drivers, and the ST7789 and CST816T interfaces.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8b949e"/></marker><style>.bg{fill:#0d1117}.grid{stroke:#30363d;opacity:.28}.box{stroke-width:2}.input{fill:#21262d;stroke:#8b949e}.core{fill:#0d419d;stroke:#58a6ff}.hardware{fill:#1f6f3d;stroke:#3fb950}.output{fill:#f0f6fc;stroke:#c9d1d9}.title{font:700 28px system-ui,sans-serif;fill:#f0f6fc}.sub{font:16px system-ui,sans-serif;fill:#8b949e}.label{font:700 17px system-ui,sans-serif;fill:#f0f6fc;text-anchor:middle}.dark{fill:#0d1117}.arrow{fill:none;stroke:#8b949e;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1200" height="570" rx="22"/><path class="grid" d="M0 105H1200M0 465H1200M300 0V570M600 0V570M900 0V570"/>
  <text class="title" x="50" y="52">LVGL GUI Runtime Pipeline</text><text class="sub" x="50" y="82">UI state becomes objects, rendered pixels, display output, and pointer input</text>
  <rect class="box input" x="430" y="120" width="340" height="56" rx="12"/><text class="label" x="600" y="155">Application UI</text>
  <rect class="box core" x="380" y="192" width="440" height="56" rx="12"/><text class="label" x="600" y="227">LVGL Objects / Events / Layout</text>
  <rect class="box core" x="330" y="264" width="540" height="56" rx="12"/><text class="label" x="600" y="299">Rendering / Draw Buffer / Flush</text>
  <rect class="box core" x="280" y="336" width="640" height="56" rx="12"/><text class="label" x="600" y="371">Display Port + Input Port</text>
  <rect class="box hardware" x="230" y="408" width="740" height="56" rx="12"/><text class="label" x="600" y="443">BSP / Drivers · SPI0 / I²C0 / EXTI</text>
  <rect class="box output" x="180" y="480" width="840" height="56" rx="12"/><text class="label dark" x="600" y="515">ST7789 Display + CST816T Touch Interface</text>
  <path class="arrow" d="M600 176V192M600 248V264M600 320V336M600 392V408M600 464V480"/>
</svg>
